services:
  unbound:
    container_name: unbound
    image: madnuttah/unbound:latest
    ports:
      - 192.168.100.8:53:5335/tcp
      - 192.168.100.8:53:5335/udp
    volumes:
      - ./unbound.conf:/usr/local/unbound/unbound.conf:rw
#     - ./conf.d/:/usr/local/unbound/conf.d/:rw
#     - ./log.d/unbound.log:/usr/local/unbound/log.d/unbound.log:rw
#     - ./zones.d/:/usr/local/unbound/zones.d/:rw
    restart: unless-stopped
    healthcheck:
      test: /usr/local/unbound/sbin/healthcheck.sh
      interval: 60s
      retries: 5
      start_period: 15s
      timeout: 30s

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "192.168.100.8:80:80"
      - "192.168.100.8:443:443"
      - "192.168.100.8:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
      - ./data/step-ca/certs/root_ca.crt:/etc/caddy/root_ca.crt:ro

  step-ca:
    env_file:
      - .env
    image: smallstep/step-ca:0.30.2
    volumes:
      - ./data/step-ca:/home/step
    dns:
      - 192.168.100.8
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
