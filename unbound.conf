# unbound.conf(5) config file for unbound(8).
server:
    directory: /usr/local/unbound
    username: ""
    # make sure unbound can access entropy from inside the chroot.
    # e.g. on linux the use these commands (on BSD, devfs(8) is used):
    #      mount --bind -n /dev/urandom /usr/local/etc/unbound/dev/urandom
    # and  mount --bind -n /dev/log /usr/local/etc/unbound/dev/log
    chroot: ""
    # logfile: "/usr/local/etc/unbound/unbound.log"  #uncomment to use logfile.
    pidfile: "/usr/local/unbound/unbound.d/unbound.pid"
    do-daemonize: no
    use-syslog: no
    # verbosity: 1      # uncomment and increase to get more logging.

    # listen on all interfaces, answer queries from the local subnet.
    interface: 0.0.0.0
    interface: ::0
    port: 5335

    access-control: 0.0.0.0/0 refuse_non_local
    access-control: ::/0 refuse_non_local

    access-control: 127.0.0.0/8 refuse_non_local
    access-control: ::1 refuse_non_local
    access-control: 10.0.0.0/8 refuse_non_local
    access-control: 192.168.100.0/24 refuse_non_local
    access-control: 172.18.0.0/16 refuse_non_local
    access-control: 192.41.136.0/28 refuse_non_local

    # Resolve these service names locally to the middleware VM; Caddy routes
    # requests to each application's VM.
    local-zone: "comsyslab.csg.uzh.ch." static

    local-data: "comsyslab.csg.uzh.ch. IN A 192.41.136.194"
    local-data: "nextcloud.comsyslab.csg.uzh.ch. IN A 192.41.136.194"
    local-data: "onlyoffice.comsyslab.csg.uzh.ch. IN A 192.41.136.194"
    local-data: "immich.comsyslab.csg.uzh.ch. IN A 192.41.136.194"
    local-data: "media.comsyslab.csg.uzh.ch. IN A 192.41.136.194"
