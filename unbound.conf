# unbound.conf(5) config file for unbound(8).
server:
    directory: "/usr/local/unbound"
    username: ""
    # make sure unbound can access entropy from inside the chroot.
    # e.g. on linux the use these commands (on BSD, devfs(8) is used):
    #      mount --bind -n /dev/urandom /usr/local/etc/unbound/dev/urandom
    # and  mount --bind -n /dev/log /usr/local/etc/unbound/dev/log
    chroot: ""
    # logfile: "/usr/local/etc/unbound/unbound.log"  #uncomment to use logfile.
    pidfile: "/usr/local/unbound/unbound.d/unbound.pid"
    do-daemonize: no
    use-syslog: no
    # verbosity: 1      # uncomment and increase to get more logging.

    # listen on all interfaces, answer queries from the local subnet.
    interface: 0.0.0.0
    interface: ::0
    port: 5335

    # Allow clients on the private 10.x.x.x network, if used. 
    access-control: 10.0.0.0/8 allow
    # Allow clients on the lab VM subnet.
    access-control: 192.168.100.0/24 allow
    # step-ca container:
    access-control: 172.18.0.0/16 allow


    # Resolve these service names locally to the middleware VM; Caddy routes
    # requests to each application's VM.
    local-zone: "service1.pilot.internal." static
    local-data: "service1.pilot.internal. IN A 192.168.100.8"
    local-zone: "service2.pilot.internal." static
    local-data: "service2.pilot.internal. IN A 192.168.100.8"
    local-zone: "service3.pilot.internal." static
    local-data: "service3.pilot.internal. IN A 192.168.100.8"
    local-zone: "service4.pilot.internal." static
    local-data: "service4.pilot.internal. IN A 192.168.100.8"
    # NAMES NEED TO BE CHANGED ACCORDING TO NAMES GIVEN BY OTHER TEAMS
