# unbound.conf(5) config file for unbound(8).
server:
    directory: "/usr/local/unbound"
    username: ""
    # make sure unbound can access entropy from inside the chroot.
    # e.g. on linux the use these commands (on BSD, devfs(8) is used):
    #      mount --bind -n /dev/urandom /usr/local/etc/unbound/dev/urandom
    # and  mount --bind -n /dev/log /usr/local/etc/unbound/dev/log
    chroot: ""
    # logfile: "/usr/local/etc/unbound/unbound.log"  #uncomment to use logfile.
    pidfile: "/usr/local/unbound/unbound.d/unbound.pid"
    do-daemonize: no
    use-syslog: no
    # verbosity: 1      # uncomment and increase to get more logging.
    # listen on all interfaces, answer queries from the local subnet.
    interface: 0.0.0.0
    interface: ::0
    port: 5335
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.100.0/24 allow
    access-control: 2001:db8::/64 allow
